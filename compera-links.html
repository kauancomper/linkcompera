<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compera Sistemas</title>
<meta name="description" content="Sites, sistemas e automações para negócios que querem crescer com estrutura. Fale com a Compera Sistemas." />
<meta property="og:title" content="Compera Sistemas" />
<meta property="og:description" content="Sites, sistemas e automações para negócios que querem crescer com estrutura." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     TOKENS — tema escuro (padrão) e tema claro
     ============================================================ */
  :root{
    --bg:            #040404;
    --glow-a:        #4a0710;
    --glow-b:        #22030a;
    --vermelho:      #F60404;
    --vermelho-suave:#ff4d4d;
    --texto:         #F6F5F4;
    --texto-fraco:   #9a9592;
    --linha:         rgba(246,245,244,0.10);
    --hover-bg:      rgba(246,4,4,0.07);
    --on-accent:     #F6F5F4;
    --sombra-avatar: rgba(246,4,4,0.45);
    --sombra-cta:    rgba(246,4,4,0.55);
  }

  html[data-theme="light"]{
    --bg:            #F7F5F4;
    --glow-a:        #ffd6d6;
    --glow-b:        #fff1f1;
    --texto:         #171414;
    --texto-fraco:   #7a7472;
    --linha:         rgba(4,4,4,0.10);
    --hover-bg:      rgba(246,4,4,0.06);
    --sombra-avatar: rgba(246,4,4,0.20);
    --sombra-cta:    rgba(246,4,4,0.30);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-tap-highlight-color: transparent; }

  body{
    background: var(--bg);
    color: var(--texto);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100svh;
    display:flex;
    justify-content:center;
    padding: 0 20px;
    line-height: 1.5;
    transition: background 0.25s ease, color 0.25s ease;
  }

  /* glow dramático atrás da logo — o único momento de ousadia da página */
  .glow{
    position:fixed;
    top:-30%;
    left:50%;
    transform:translateX(-50%);
    width:600px;
    height:600px;
    background: radial-gradient(circle, var(--glow-a) 0%, var(--glow-b) 38%, transparent 70%);
    filter: blur(10px);
    opacity:0.65;
    pointer-events:none;
    z-index:0;
    transition: background 0.25s ease;
  }

  /* botão de alternância de tema */
  .theme-toggle{
    position:fixed;
    top:18px;
    right:18px;
    z-index:2;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--linha);
    background: transparent;
    color: var(--texto);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .theme-toggle:hover{ border-color: var(--vermelho-suave); background: var(--hover-bg); }
  .theme-toggle svg{ width:18px; height:18px; }
  .theme-toggle .icon-moon{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-sun{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-moon{ display:block; }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    padding: 56px 0 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    opacity:0;
    transform:translateY(8px);
    animation: reveal 0.6s ease-out forwards;
  }

  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .page{ animation:none; opacity:1; transform:none; }
  }

  .logo{
    width:100%;
    max-width:250px;
    height:auto;
    margin-bottom:14px;
    filter: drop-shadow(0 12px 26px var(--sombra-avatar));
  }

  .subtitulo{
    color: var(--texto-fraco);
    font-size:15px;
    font-weight:400;
    max-width: 320px;
    margin-bottom: 36px;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding: 16px 18px;
    border-radius:14px;
    text-decoration:none;
    font-weight:600;
    font-size:15.5px;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .link:active{ transform: scale(0.98); }

  .link svg{ flex-shrink:0; width:20px; height:20px; }

  .link .rotulo{ flex:1; text-align:left; }

  .link .meta{
    font-size:12.5px;
    color:inherit;
    opacity:0.7;
    font-weight:500;
  }

  /* CTA primário — o único link preenchido em vermelho sólido */
  .link.primario{
    background: var(--vermelho);
    color: var(--on-accent);
    box-shadow: 0 10px 24px -10px var(--sombra-cta);
  }
  .link.primario:hover{ background: var(--vermelho-suave); }

  /* Links secundários — contorno discreto, sem sombra genérica de card */
  .link.secundario{
    background: transparent;
    border: 1px solid var(--linha);
    color: var(--texto);
  }
  .link.secundario:hover{
    border-color: rgba(246,4,4,0.55);
    background: var(--hover-bg);
  }

  footer{
    margin-top:40px;
    font-size:13px;
    color: var(--texto-fraco);
  }

  footer a{
    color: var(--texto);
    text-decoration:none;
    font-weight:600;
    border-bottom: 1px solid var(--linha);
  }
  footer a:hover{ border-color: var(--vermelho); }

  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--vermelho-suave);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.7A8.5 8.5 0 0 1 9.3 3.5a.6.6 0 0 0-.7-.8A9.5 9.5 0 1 0 21.3 15.4a.6.6 0 0 0-.8-.7Z"/></svg>
</button>

<main class="page">
  <img class="logo" id="logoImg" src="compera-logo-dark.svg" alt="Compera Sistemas" />
  <p class="subtitulo">Tecnologia para negócios que querem crescer.<br>Sites, sistemas e automações que transformam processos em estrutura, eficiência e resultado.</p>

  <nav class="links" id="links"></nav>

  <footer>
    <a href="https://instagram.com/compera_sistemas" target="_blank" rel="noopener">@compera_sistemas</a>
  </footer>
</main>

<script>
  /* ============================================================
     EDITE AQUI — número e mensagens do WhatsApp, URL do site
     ============================================================ */
  const WHATSAPP_NUMERO = "5594992026252"; // 55 + DDD 94 + número
  const SITE_URL        = "https://comperasistemas.com.br";

  const msgOrcamento    = "Olá! Vim pelo link da Compera e quero pedir um orçamento.";
  const msgDiagnostico  = "Olá! Vim pelo link da Compera e queria pedir um diagnóstico gratuito do meu site ou sistema.";

  const wa = (msg) => `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(msg)}`;

  const icons = {
    whatsapp: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.48 1.33 5L2 22l5.2-1.36a9.9 9.9 0 0 0 4.84 1.23h.01c5.5 0 9.96-4.46 9.96-9.96S17.54 2 12.04 2Zm0 18.2h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.09.81.82-3-.2-.31a8.24 8.24 0 0 1-1.26-4.4c0-4.55 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.2 8.2 0 0 1 2.41 5.83c0 4.55-3.7 8.22-8.26 8.22Zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.4-.12-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.04-.38-1.99-1.22-.73-.66-1.23-1.46-1.37-1.71-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.56-1.36-.77-1.86-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.87.86-.87 2.09 0 1.23.9 2.42 1.02 2.59.12.17 1.77 2.72 4.29 3.81.6.26 1.07.42 1.43.53.6.19 1.15.17 1.58.1.48-.07 1.47-.6 1.68-1.19.21-.58.21-1.08.15-1.19-.06-.1-.23-.16-.48-.29Z"/></svg>`,
    target:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/></svg>`,
    globe:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.7 5.3 3.7 8.5s-1.3 6.2-3.7 8.5c-2.4-2.3-3.7-5.3-3.7-8.5S9.6 5.8 12 3.5Z"/></svg>`,
  };

  const links = [
    { tipo:"primario",   icon:"whatsapp", rotulo:"Falar no WhatsApp",        meta:"resposta rápida",       href: wa(msgOrcamento) },
    { tipo:"secundario", icon:"target",   rotulo:"Pedir diagnóstico grátis", meta:"site ou sistema",       href: wa(msgDiagnostico) },
    { tipo:"secundario", icon:"globe",    rotulo:"Visitar o site",           meta:"comperasistemas.com.br", href: SITE_URL }
  ];

  const nav = document.getElementById("links");
  nav.innerHTML = links.map(l => `
    <a class="link ${l.tipo}" href="${l.href}" target="_blank" rel="noopener">
      ${icons[l.icon]}
      <span class="rotulo">${l.rotulo}</span>
      <span class="meta">${l.meta}</span>
    </a>
  `).join("");

  /* ============================================================
     Alternância de tema — troca a logo junto com o esquema de cores
     ============================================================ */
  const html = document.documentElement;
  const logoImg = document.getElementById("logoImg");
  const toggleBtn = document.getElementById("themeToggle");

  const LOGOS = {
    dark:  "compera-logo-dark.svg",
    light: "compera-logo-light.svg"
  };

  function applyTheme(theme){
    html.setAttribute("data-theme", theme);
    logoImg.src = LOGOS[theme];
    try { localStorage.setItem("compera-theme", theme); } catch(e) {}
  }

  let savedTheme = "dark";
  try {
    savedTheme = localStorage.getItem("compera-theme")
      || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch(e) {}
  applyTheme(savedTheme);

  toggleBtn.addEventListener("click", () => {
    const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
  });
</script>

</body>
</html>
